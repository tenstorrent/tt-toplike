[package]
name = "tt-toplike"
version = "0.10.3"
edition = "2021"
# MSRV: the pinned toolchain (1.93) is the only version we actually build/test
# against, so it's the only verified floor. Bump this in lockstep with CI's
# toolchain if we ever raise it.
rust-version = "1.93"
authors = ["Tenstorrent <software@tenstorrent.com>"]
license = "Apache-2.0"
description = "Real-time hardware monitoring for Tenstorrent silicon"
repository = "https://github.com/tenstorrent/tt-toplike"
readme = "README.md"
keywords = ["tenstorrent", "monitoring", "tui", "hardware", "telemetry"]
categories = ["command-line-utilities", "visualization"]

# Multiple binaries - TUI and GUI frontends
[[bin]]
name = "tt-toplike-tui"
path = "src/bin/tui.rs"
required-features = ["tui"]

[[bin]]
name = "tt-toplike-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[[bin]]
name = "tt-toplike-egui"
path = "src/bin/egui.rs"
required-features = ["egui"]

[[bin]]
name = "tt-toplike-app"
path = "src/bin/app.rs"
required-features = ["app"]

# Default binary (TUI)
[lib]
name = "tt_toplike"
path = "src/lib.rs"

[dependencies]
# Tenstorrent hardware access (OPTIONAL - invasive, requires explicit --backend luwen)
# NOTE: Luwen telemetry is kernel-mediated (tt-kmd) and mostly passive reads, but
# Luwen/UMD resource arbitration is unresolved upstream (DEVINFRA-4445): first-read
# sends an ARC mailbox message on WH/GS, and concurrent use can contend with workloads
# Only use with --backend luwen flag, never in auto-detect mode
#
# Official Tenstorrent luwen crates (crates.io, published from tenstorrent/luwen).
# Replaces the abandoned all-smi-luwen-* forks (stale since 2025-07: missing
# Blackhole telemetry tags and the negative 16.16-FP temperature fix).
# NOTE (kmd ≥ 2.9/2.10): holding /dev/tenstorrent/N open participates in
# driver-managed power-state aggregation and blocks O_EXCL openers (tt-flash);
# one more reason luwen stays explicit-only and out of auto-detect.
#
# Three crates are needed, not two:
#   luwen-api — protocol/arch layer (Chip, ChipImpl, Telemetry decode). It has NO
#               hardware transport: its dependency set contains no PCI/ttkmd
#               crate, and `luwen_api::detect_chips_silent(root_chips, …)`
#               enumerates *from its argument*, so calling it with an empty Vec
#               returns Ok(vec![]) and no device is ever found.
#   luwen-pci — the PCIe transport + the detection entry point that does its own
#               `PciDevice::scan()` (`luwen_pci::detect_chips_silent(options)`).
#               This is what upstream's own examples/tests use; without it the
#               backend cannot see hardware at all.
#   luwen-def — shared definitions (Arch).
luwen-api = { version = "0.8.5", optional = true }
luwen-pci = { version = "0.8.5", optional = true }
luwen-def = { version = "0.8.5", optional = true }

# TUI framework (optional - only needed for TUI frontend)
ratatui = { version = "0.30", default-features = true, optional = true }
crossterm = { version = "0.29", features = ["event-stream"], optional = true }
unicode-width = "0.1"

# GUI framework (optional - only needed for GUI frontend)
# iced 0.14: boot fn is first arg (not title string), .title() is builder method, .run() replaces .run_with()
iced = { version = "0.14", features = ["canvas", "tokio"], optional = true }

# egui framework (optional - lightweight dashboard)
eframe = { version = "0.33", optional = true }  # egui application framework
egui_plot = { version = "0.34", optional = true }  # Plotting for egui

# Terminal app (optional - PTY-hosted TUI window)
portable-pty = { version = "0.9.0", optional = true }  # PTY spawn + resize
vte = { version = "0.13", optional = true }             # ANSI/VT parser (alacritty)

# Async runtime
tokio = { version = "1.49", features = ["full"] }
tokio-util = "0.7"

# WebSocket client for the remote QuietBox (WsBackend) telemetry stream.
# Additive and OPTIONAL: only the opt-in --remote path uses these, gated behind
# the `remote` feature (in `default`, so normal builds are unchanged). Packagers
# who don't want the WS stack can opt out with --no-default-features.
tokio-tungstenite = { version = "0.24", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"], optional = true }

# JSON parsing (for JSON backend fallback)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI parsing
clap = { version = "4.5", features = ["derive", "cargo"] }

# System monitoring
sysinfo = "0.38"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

# Math utilities
num-traits = "0.2"
rand = "0.9"  # For particle effects

# Configuration
toml = "0.8"

# Platform config/data directories (used by AnimConfig to locate ~/.config/tt-toplike/config.toml)
dirs = "6"

# Lock-free atomic Arc swap — eliminates mutex contention on the render path
arc-swap = "1.7"

# Path resolution — resolves bare program names via PATH at startup
which = "7"

[target.'cfg(unix)'.dependencies]
# libc: used for kill(2) syscall in the Insights screen kill panel
libc = "0.2"

# Linux-only process monitoring via /proc. Scoped to the linux target so the
# crate is never compiled on macOS/Windows (procfs refuses to build elsewhere).
# The `linux-procfs` feature still references it (it's in `default`), but every
# code path that uses it is additionally gated on `target_os = "linux"`, so
# enabling the feature on a non-Linux host is a harmless no-op, not a build error.
[target.'cfg(target_os = "linux")'.dependencies]
procfs = { version = "0.17", optional = true }  # Linux-specific

# Apple GPU/ANE telemetry (macOS only, no sudo). core-foundation provides the
# CFDictionary/CFArray/CFString interop used to walk the private IOReport
# framework's "Energy Model" channels for the ANE power sampler. No block2:
# we iterate the IOReportChannels CFArray directly rather than via a callback.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[dev-dependencies]
# Testing
mockall = "0.13"
pretty_assertions = "1.4"
tempfile = "3.13"

[features]
# Default features: Safe, non-invasive backends only
# Luwen backend excluded from default to prevent hardware disruption
default = ["tui", "json-backend", "linux-procfs", "remote"]

# Frontend features
tui = ["ratatui", "crossterm"]  # Terminal UI with Ratatui
gui = ["iced"]                  # Native GUI with iced (legacy)
egui = ["eframe", "egui_plot"]  # Lightweight egui dashboard
app = ["eframe", "egui_plot", "portable-pty", "vte"]  # Native terminal window

# Backend features
# IMPORTANT: luwen-backend is OPTIONAL and must be explicitly enabled
# Its Luwen/UMD contention story is unresolved upstream; avoid during workloads,
# especially on multi-chip/galaxy topologies
# Only use with explicit --backend luwen flag
# Direct hardware access (EXPLICIT ONLY). luwen-pci carries the PCIe transport;
# without it luwen-api can never enumerate a local device — see the dependency
# comments above.
luwen-backend = ["dep:luwen-api", "dep:luwen-pci", "dep:luwen-def"]
json-backend = []               # Subprocess tt-smi + JSON (SAFE)
linux-procfs = ["procfs"]       # Enhanced Linux process detection
# Remote QuietBox WebSocket backend (--remote). In `default`; opt out with
# --no-default-features. When off, the Remote variant returns a clean error.
remote = ["tokio-tungstenite", "futures-util"]

# ── Debian packaging metadata (used by `cargo deb` for quick developer .debs)
# For PPA/official builds use dpkg-buildpackage via build-deb.sh instead.
[package.metadata.deb]
name = "tt-toplike"
maintainer = "Tenstorrent <software@tenstorrent.com>"
copyright = "2026, Tenstorrent Inc."
license-file = ["LICENSE", "3"]
# $auto expands to dh_shlibdeps-style detected library deps at build time
depends = "$auto"
recommends = "tt-smi, tenstorrent-dkms, curl"
# NB: debian/control no longer builds a tt-toplike-egui package (the egui bin was
# dropped in favour of the PTY-hosted tt-toplike-app), so don't suggest it here.
suggests = "tenstorrent-tools"
section = "utils"
priority = "optional"
# Build with safe defaults — no Luwen, no iced GUI. Includes `remote` so packaged
# builds keep --remote (it was unconditional before the feature gate was added).
features = ["tui", "json-backend", "linux-procfs", "remote"]
assets = [
  # Binary renamed: tt-toplike-tui → tt-toplike (shorter, global name)
  ["target/release/tt-toplike-tui", "usr/bin/tt-toplike", "755"],
  ["README.md", "usr/share/doc/tt-toplike/README.md", "644"],
  ["QUICK_START.md", "usr/share/doc/tt-toplike/QUICK_START.md", "644"],
]

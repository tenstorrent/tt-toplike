[dependencies.pin-project-lite]
version = "0.2"

[dev-dependencies.static_assertions]
version = "1.1.0"

[build-dependencies.android-build]
version = "0.1.3"

[target.'cfg(all(any(target_arch = "wasm32", target_arch = "wasm64"), target_os = "unknown"))'.dependencies.futures-channel]

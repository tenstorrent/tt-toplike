[package]
edition = "2021"
rust-version = "1.80.0"
name = "mundy"
version = "0.2.3"
build = "build.rs"
exclude = [
    "Justfile",
    "_typos.toml",
    "notes.md",
    "scripts/",
    ".github/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Reads various system-level accessibility and UI preferences"
readme = "readme.md"
keywords = [
    "accessibility",
    "contrast",
    "UI",
    "color",
    "accent",
]
categories = [
    "os",
    "gui",
]
license = "Apache-2.0"
repository = "https://github.com/tautropfli/mundy"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[features]
_all-preferences = [
    "color-scheme",
    "contrast",
    "reduced-motion",
    "reduced-transparency",
    "scrollbar-visibility",
    "accent-color",
    "double-click-interval",
]
_gnome_only = []
_macos-accessibility = [
    "_macos-observable",
    "objc2-app-kit/NSWorkspace",
    "objc2-app-kit/NSAccessibility",
]
_macos-observable = ["dep:futures-channel"]
_windows-ui-settings = ["_winrt"]
_winrt = [
    "windows/UI_ViewManagement",
    "windows/Win32_System_WinRT",
]
accent-color = [
    "_macos-observable",
    "_windows-ui-settings",
    "web-sys/Comment",
    "web-sys/CssStyleDeclaration",
    "web-sys/Document",
    "web-sys/HtmlElement",
    "web-sys/TransitionEvent",
    "web-sys/css",
    "objc2-app-kit/NSColorSpace",
    "objc2-app-kit/NSColor",
    "objc2-foundation/NSDistributedNotificationCenter",
    "objc2-foundation/NSNotification",
]
async-io = [
    "zbus/async-io",
    "dep:async-io",
]
callback = [
    "dep:beul",
    "dep:futures-channel",
]
color-scheme = [
    "_macos-observable",
    "_windows-ui-settings",
    "dep:dispatch",
    "objc2-app-kit/NSAppearance",
    "objc2-foundation/NSKeyValueObserving",
]
contrast = [
    "_macos-accessibility",
    "_winrt",
]
default = [
    "async-io",
    "callback",
    "_all-preferences",
]
double-click-interval = [
    "_gnome_only",
    "objc2-app-kit/NSEvent",
    "windows/Win32_UI_Input_KeyboardAndMouse",
]
reduced-motion = [
    "_macos-accessibility",
    "_gnome_only",
    "_windows-ui-settings",
]
reduced-transparency = [
    "_macos-accessibility",
    "_windows-ui-settings",
]
scrollbar-visibility = [
    "_gnome_only",
    "_windows-ui-settings",
]
tokio = [
    "zbus/tokio",
    "dep:tokio",
]

[lib]
name = "mundy"
path = "src/lib.rs"

[dependencies.cfg-if]
version = "1.0.0"

[dependencies.futures-channel]
version = "0.3"
optional = true

[dependencies.futures-lite]
version = "2.3"

[dependencies.log]
version = "0.4"

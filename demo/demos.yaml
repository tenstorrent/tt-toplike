project: tt-toplike
theme: tt-brand

defaults:
  cols: 160
  rows: 44
  # Real hardware, safe backend: hybrid reads the driver's sysfs surfaces and
  # tt-smi. It never opens /dev/tenstorrent, so it cannot perturb the training
  # run these scenes are recorded against.
  backend: "--backend hybrid"
  outputs: [cast, gif, mp4]
  render:
    # An animated TUI at agg defaults lands at 15-25 MB; these knobs keep the
    # artifacts small enough for a README and the project site.
    fps_cap: 10
    font_size: 12

scenes:
  - id: training-view
    title: "Training view: a live tt-train run"
    layout: single
    right:
      run: "tt-toplike-tui {backend} --mode training"
    duration: 30s
    caption: >-
      The Training view auto-attaches to a running trainer, tails the log its
      stdout already points at, and renders the run: the loss mountain range
      descending as the model converges, forward and backward sweeps travelling
      the network, and the chips actually doing the work heating up beneath it.

  - id: rotate
    title: "Rotate: every view, unattended"
    layout: single
    right:
      run: "tt-toplike-tui {backend} --rotate"
    duration: 180s
    caption: >-
      `--rotate` cycles every view — including the three normally reachable only
      by their own key — dwelling 30s on each, 45s on arcade, and only 10s on a
      workload view with nothing to show.

  - id: reset-demo
    title: "tt-smi -r: the five reset animations"
    layout: single
    right:
      run: "tt-toplike-tui {backend} --tt-smi-reset-behavior demo"
    # Five animations at 8 s each, played back to back at startup.
    duration: 44s
    caption: >-
      `--tt-smi-reset-behavior demo` plays all five reset animations in a row,
      eight seconds each, in a box titled DEMO so a staged animation is never
      taken for a real reset. No reset is run for this capture. The same
      animations play over a real `tt-smi -r` under `dazzle`.


  - id: arcade-lanes
    title: "Arcade: an activity lane for the running model"
    layout: single
    right:
      run: "tt-toplike-tui {backend} --mode arcade"
    duration: 30s
    caption: >-
      Arcade shows what is running. While a model compiles, loads or serves,
      the top starfield rows become a lane with the model name, where it runs
      (port and chips) and what it is doing, with `[i]` to open the full view.
      The stars take a tint for the kind of work and flare once per finished
      request.

  - id: inference-music
    title: "Inference view: an audio model making a track"
    raw_script: demo/raw/inference-music.sh
    duration: 56s
    caption: >-
      The Inference view beside a live MiniMax-Music3 server. The model is
      named from what the server reports, the lane shows the port and the one
      chip it holds, and a busy server draws its forming canvas behind the
      dashboard. The backdrop follows the server's own busy and queue figures.

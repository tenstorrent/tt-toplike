name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # upload release assets and push gh-pages

jobs:
  # ── Build .deb packages for each supported Ubuntu suite ────────────────────
  #
  # We run a separate job per suite so each binary links against the glibc
  # version shipped with that Ubuntu release:
  #   noble (24.04) → libc6 >= 2.39
  #   jammy (22.04) → libc6 >= 2.35  (also installs on 24.04)
  #
  # The jammy job patches debian/changelog in-place to change the target
  # suite from "noble" to "jammy" before building.  The resulting .deb files
  # are renamed with a suite suffix before upload so both can coexist in the
  # same GitHub Release.
  build-deb:
    name: Build .deb (${{ matrix.suite }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false   # if one suite fails, still publish the other
      matrix:
        include:
          - runner: ubuntu-24.04
            suite:  noble
          - runner: ubuntu-22.04
            suite:  jammy

    steps:
      - uses: actions/checkout@v4

      - name: Install packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            devscripts \
            debhelper \
            rustc \
            cargo

      # For non-noble suites: patch the first changelog entry's suite name so
      # dpkg-buildpackage targets the correct distribution.  This is a
      # transient in-tree edit — it never gets committed.
      - name: Patch changelog suite (${{ matrix.suite }})
        if: matrix.suite != 'noble'
        run: sed -i "1s/) noble;/) ${{ matrix.suite }};/" debian/changelog

      - name: Build .deb packages
        run: ./build-deb.sh --quick

      # Rename output files to include the suite so both variants can be
      # uploaded to the same GitHub Release without overwriting each other.
      # dpkg-buildpackage always writes to the parent directory.
      - name: Rename packages with suite suffix
        run: |
          SUITE="${{ matrix.suite }}"
          for deb in ../tt-toplike*.deb; do
            # e.g. ../tt-toplike_0.4.3_amd64.deb
            #   → ../tt-toplike_0.4.3_amd64_noble.deb
            newname="${deb%.deb}_${SUITE}.deb"
            mv "$deb" "$newname"
            echo "Renamed: $(basename "$deb") → $(basename "$newname")"
          done

      - name: Ensure release exists, then upload packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUITE="${{ matrix.suite }}"

          # Create the release only if it doesn't already exist.
          # Matrix jobs race here; the losing job will see the release already
          # created by the winner and skip straight to upload — that's fine.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping create."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

          gh release upload "$GITHUB_REF_NAME" \
            ../tt-toplike_*_amd64_${SUITE}.deb \
            ../tt-toplike-app_*_amd64_${SUITE}.deb \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  # ── Build a universal macOS binary (experimental --host preview) ───────────
  #
  # macOS can't be cross-compiled from the Linux runners above: the host
  # backend links the private IOReport framework (src/backend/ane_macos.rs) and
  # CoreFoundation, and shells out to `ioreg`, so it needs the real macOS SDK
  # and linker. We build natively on a macos-14 (Apple Silicon) runner instead.
  #
  # A single runner produces a UNIVERSAL binary: we build both arches (the SDK
  # carries both framework slices, so cross-arch linking within macOS works)
  # and fuse them with `lipo`. The result is the TUI binary only — no .deb, no
  # GUI app, and it is UNSIGNED/UNNOTARIZED, so first launch hits a Gatekeeper
  # prompt (right-click → Open, or `xattr -dr com.apple.quarantine <bin>`).
  build-macos:
    name: Build macOS (universal)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Add Rust targets (arm64 + x86_64)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # --no-default-features drops linux-procfs (its procfs dep is Linux-only);
      # tui + json-backend match the README build line. The host backend and
      # Apple GPU/ANE devices are always compiled — no feature flag needed.
      - name: Build TUI for both arches
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target" \
              --bin tt-toplike-tui \
              --no-default-features --features tui,json-backend
          done

      - name: Fuse into a universal binary
        run: |
          mkdir -p dist
          lipo -create -output dist/tt-toplike-tui \
            target/aarch64-apple-darwin/release/tt-toplike-tui \
            target/x86_64-apple-darwin/release/tt-toplike-tui
          lipo -info dist/tt-toplike-tui

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "$VERSION" ] || VERSION="dev"   # workflow_dispatch has no tag
          cp LICENSE NOTICE README.md dist/
          TARBALL="tt-toplike-tui-${VERSION}-macos-universal.tar.gz"
          tar -C dist -czf "$TARBALL" .
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          shasum -a 256 "$TARBALL"

      - name: Ensure release exists, then upload tarball
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Matrix .deb jobs may create the release first; create only if absent
          # (same race-tolerant pattern as build-deb).
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping create."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

          gh release upload "$GITHUB_REF_NAME" \
            "$TARBALL" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  # ── Update site/ in main and let deploy-site.yml publish it ─────────────────
  update-site:
    name: Update project site
    runs-on: ubuntu-24.04
    needs: build-deb
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # site/ lives on main; tag may point to a release branch

      - name: Update version in site/index.html
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"

          sed -i "s|Tenstorrent Hardware Monitor · v[0-9]*\.[0-9]*\.[0-9]* · Rust|Tenstorrent Hardware Monitor · v${VERSION} · Rust|g" \
            site/index.html

          sed -Ei "s|(gh release download )--repo [^ ]*|\1--repo ${REPO}|g" \
            site/index.html

      - name: Commit updated site
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          if git diff --quiet; then
            echo "No site changes needed."
          else
            git add site/index.html
            git commit -m "site: bump to ${GITHUB_REF_NAME}"
            git push origin main
          fi

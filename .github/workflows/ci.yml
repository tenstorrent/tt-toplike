name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: |
          # Run fmt check on the whole codebase but only fail for files changed
          # in this PR — pre-existing formatting debt in untouched files does
          # not block contributors.
          git fetch origin main --depth=1
          BASE=$(git merge-base HEAD origin/main)
          CHANGED=$(git diff --name-only "$BASE" HEAD -- '*.rs' | grep -v '^vendor/' | sort || true)

          set +e
          FMT_OUT=$(cargo fmt --check 2>&1)
          FMT_EXIT=$?
          set -e

          if [ $FMT_EXIT -eq 0 ]; then
            echo "All files properly formatted."
            exit 0
          fi

          # Extract failing paths (cargo fmt prints absolute paths); strip cwd prefix.
          FAILING=$(echo "$FMT_OUT" | grep "^Diff in " | sed "s|Diff in $(pwd)/||" | cut -d: -f1 | sort -u)
          BLOCKING=$(comm -12 <(echo "$CHANGED") <(echo "$FAILING"))

          if [ -n "$BLOCKING" ]; then
            echo "Formatting errors in PR-changed files — run 'cargo fmt' locally:"
            echo "$BLOCKING"
            exit 1
          fi
          echo "Formatting ok (pre-existing issues in untouched files are ignored)."

      - name: Clippy (TUI, zero warnings)
        run: cargo clippy --locked --lib --bin tt-toplike-tui --features tui -- -D warnings

      - name: Run library tests
        run: cargo test --locked --lib --features tui

      - name: Build TUI binary (zero warnings)
        run: cargo build --locked --bin tt-toplike-tui --features tui
        env:
          RUSTFLAGS: -D warnings

      - name: Build GUI binary
        run: cargo build --locked --bin tt-toplike-gui --features gui
        env:
          RUSTFLAGS: -D warnings

  # ── Windows build + tests ──────────────────────────────────────────────────
  # Gives real Windows coverage for the cross-platform `--host` path. Uses the
  # native MSVC target on GitHub's windows-latest runner. Linux-only modules
  # (procfs, the /proc socket table, the libc kill panel) are cfg-gated out, so
  # we build the same safe feature set that cross-compiles cleanly:
  # tui + json-backend, without linux-procfs.
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run library tests
        run: cargo test --locked --lib --no-default-features --features tui,json-backend

      - name: Build TUI binary (zero warnings)
        run: cargo build --locked --bin tt-toplike-tui --no-default-features --features tui,json-backend
        env:
          RUSTFLAGS: -D warnings

      # Runtime proof on real Windows: --bench is headless (needs no TTY) and
      # exercises the actual Windows code paths — notably sysinfo's PDH calls,
      # which Wine can't emulate. A non-zero exit here fails the job.
      - name: Runtime smoke (headless --bench)
        run: cargo run --locked --bin tt-toplike-tui --no-default-features --features tui,json-backend -- --bench --mock
